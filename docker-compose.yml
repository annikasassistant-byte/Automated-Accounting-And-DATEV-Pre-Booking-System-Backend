# Depth Dashboard — local / staging stack
# Usage:
#   docker compose up --build
#   docker compose -f docker-compose.yml up app mongo redis
#
# For MongoDB Atlas, omit the `mongo` service and set MONGODB_URI to your Atlas SRV string.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: depth-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/depth_dashboard}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    networks:
      - depth-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # Optional local Mongo — prefer Atlas in production:
  # MONGODB_URI=mongodb+srv://user:pass@cluster.mongodb.net/depth_dashboard
  mongo:
    image: mongo:7
    container_name: depth-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: depth_dashboard
    volumes:
      - mongo_data:/data/db
    networks:
      - depth-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: depth-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - depth-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Optional: run API with hot reload
  # app-dev:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.dev
  #   volumes:
  #     - ./src:/app/src
  #   ports:
  #     - "5000:5000"
  #   env_file: .env
  #   depends_on: [mongo, redis]
  #   networks: [depth-net]

networks:
  depth-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  app_uploads:
  app_logs:
