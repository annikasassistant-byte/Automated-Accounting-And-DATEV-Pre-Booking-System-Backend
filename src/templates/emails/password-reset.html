<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
</head>
<body style="font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#f6f7f9; padding:24px;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
    <tr><td>
      <h1 style="margin:0 0 12px;font-size:22px;color:#111;">Reset your password</h1>
      <p style="color:#444;line-height:1.5;">Hi {{firstName}},</p>
      <p style="color:#444;line-height:1.5;">We received a request to reset your {{appName}} password. This link expires in {{expiresMinutes}} minutes.</p>
      <p style="margin:28px 0;">
        <a href="{{resetUrl}}" style="background:#111;color:#fff;text-decoration:none;padding:12px 20px;border-radius:6px;display:inline-block;">Reset password</a>
      </p>
      <p style="color:#777;font-size:13px;line-height:1.5;">If you did not request this, you can ignore this email.</p>
      <p style="color:#777;font-size:13px;line-height:1.5;">Or paste this URL:<br/>{{resetUrl}}</p>
      <p style="color:#999;font-size:12px;margin-top:32px;">— {{appName}}</p>
    </td></tr>
  </table>
</body>
</html>
