name: Deploy API Production

on:
  push:
    branches:
      - production

concurrency:
  group: api-production
  cancel-in-progress: false

jobs:
  ci-and-deploy:
    name: CI gate on production push (Render auto-deploys from git)
    runs-on: ubuntu-latest

    environment:
      name: production

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --forceExit

      - name: Build
        run: npm run build

      - name: Wait for Render API (optional)
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "API_HEALTH_URL not set — skipping live health wait (Render deploys from git push)."
            exit 0
          fi

          echo "Waiting for API after Render deploy..."
          for i in $(seq 1 30); do
            echo "Health check attempt $i/30..."
            if curl --fail --silent --show-error --location --max-time 10 "$API_HEALTH_URL"; then
              echo "API is healthy!"
              exit 0
            fi
            sleep 10
          done

          echo "API health check failed after 5 minutes."
          exit 1
