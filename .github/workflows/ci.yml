name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/depth_dashboard_ci
      REDIS_URL: redis://127.0.0.1:6379/1
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters!!!!
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters!!!
      COOKIE_SECRET: ci-cookie-secret-min-32-characters!!!!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage --forceExit

      - name: Build Docker image
        run: docker build -t depth-dashboard-api:ci .
